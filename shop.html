<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | VOREN FASHION.KE</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/shop.css">
</head>
<body>

  <header class="navbar">
    <div class="container">
      <a href="index.html" class="logo">VOREN</a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="index.html#contact">Contact</a>
        <a href="cart.html" class="cart-link">Cart (<span id="cart-count">0</span>)</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Shop</h1>
    <div class="filters" id="filters"></div>
    <div class="product-grid" id="product-grid"></div>
  </main>

  <footer class="footer">
    <div class="container"><p>&copy; 2026 VOREN FASHION.KE. Nairobi, Kenya.</p></div>
  </footer>

  <a class="whatsapp-float" href="https://wa.me/254702590668?text=Hi%20VOREN,%20I'd%20like%20to%20order" target="_blank" rel="noopener">WhatsApp</a>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    const grid = document.querySelector("#product-grid");
    const filters = document.querySelector("#filters");
    let active = "All";

    const money = (n) => "KES " + n.toLocaleString("en-KE");

    function renderFilters() {
      const cats = ["All", ...new Set(PRODUCTS.map((p) => p.category))];
      filters.innerHTML = cats
        .map((c) => <button class="filter-btn ${c === active ? "active" : ""}" data-cat="${c}">${c}</button>)
        .join("");
    }

    function renderProducts() {
      const list = active === "All" ? PRODUCTS : PRODUCTS.filter((p) => p.category === active);
      grid.innerHTML = list.map((p) => `
        <article class="product-card">
          <a href="product.html?id=${p.id}">
            ${p.image ? <img src="${p.image}" alt="${p.name}"> : <div class="img-placeholder"></div>}
            <h3>${p.name}</h3>
          </a>
          <p class="price">${money(p.price)}</p>
          <button class="btn btn-outline btn-small" data-id="${p.id}">Add to cart</button>
        </article>`).join("");
    }

    filters.addEventListener("click", (e) => {
      const btn = e.target.closest(".filter-btn");
      if (!btn) return;
      active = btn.dataset.cat;
      renderFilters();
      renderProducts();
    });

    grid.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-id]");
      if (!btn) return;
      const p = PRODUCTS.find((x) => x.id === Number(btn.dataset.id));
      addToCart({ id: p.id, name: p.name, price: p.price, size: "M" });
      btn.textContent = "Added ✓";
      setTimeout(() => (btn.textContent = "Add to cart"), 1200);
    });

    renderFilters();
    renderProducts();
  </script>
</body>
</html>
